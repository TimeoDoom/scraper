name: Scraper Lannion

on:
  workflow_dispatch:

jobs:
  scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v6

      - name: Vérifier les fichiers
        run: |
          pwd
          ls -la
          find . -maxdepth 2 -type f | sort

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Installer les dépendances Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Installer Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Installer Lighthouse
        run: |
          npm install lighthouse

      - name: Installer Google Chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - name: Installer Chromium Playwright
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: Vérifier les installations
        run: |
          python --version
          node --version
          npx lighthouse --version
          which google-chrome || true

      - name: Lancer le scraper
        run: |
          python "${{ github.workspace }}/main.py"

      - name: Sauvegarder les résultats
        uses: actions/upload-artifact@v4
        with:
          name: resultats-scraping
          path: |
            avec_site_lannion.csv
            sans_site_lannion.csv
          if-no-files-found: warn
